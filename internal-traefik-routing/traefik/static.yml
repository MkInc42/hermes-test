global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":8080"
  # Healthcheck-only entrypoint; it is not published by Compose.
  ping:
    address: ":8082"

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: ping

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # Require a stack-specific opt-in in addition to traefik.enable=true so
    # unrelated containers (including the unchanged intake-api) stay invisible.
    constraints: "Label(`traefik.internal-lan`, `true`)"
    network: proxy-public
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}

serversTransport:
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
