# Postgres for the phish-triage-engine persistence milestone (task t_aeaf2caa).
# Standalone instance so we never share state with other projects' databases.
# Scanner/API services added in later cards.
services:
  db:
    image: postgres:16.6-alpine
    container_name: phish-triage-db
    environment:
      POSTGRES_USER: pte
      POSTGRES_PASSWORD: pte_local_dev_password_change_me
      POSTGRES_DB: phish_triage
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pte -d phish_triage"]
      interval: 2s
      timeout: 3s
      retries: 20

  pia-vpn:
    build:
      context: ./docker/vpn-sidecar
    container_name: pia-vpn
    profiles: ["vpn-live"]
    cap_add: ["NET_ADMIN"]
    devices: ["/dev/net/tun:/dev/net/tun"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /run:size=1m,mode=0755
      - /tmp:size=1m,mode=1777
    restart: "no"
    volumes:
      - ${PTE_VPN_OVPN_PATH:?set absolute OVPN path}:/vpn/operator.ovpn:ro
      - ${PTE_VPN_AUTH_FILE:?set absolute auth path}:/vpn/operator.auth:ro
    healthcheck:
      test: ["CMD", "/usr/local/sbin/vpn-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pte_pgdata:
